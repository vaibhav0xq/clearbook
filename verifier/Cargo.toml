[package]
name = "clearbook-verifier"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clearbook-verify"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
ryu-js = "1.0"
ureq = { version = "2.12", features = ["json"] }
